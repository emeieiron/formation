<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img" aria-labelledby="title description">
  <title id="title">Formation architecture</title>
  <desc id="description">Guest phones and the Seeker host exchange inputs, seals, state and clock samples over a local network. Challenge modules use a shared session framework. The Seeker sends approved unlock and payout transactions through a ledger with a durable submission journal. Guests keep a proof and protected claim key for deferred claims. A sponsor funds the Solana vault, which pays recipient wallets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#777b70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #30392d; }
      .heading { font-family: Georgia, 'Times New Roman', serif; font-size: 36px; fill: #343831; }
      .subtitle { font-size: 21px; fill: #656a60; }
      .boundary-label { font-size: 20px; fill: #717668; }
      .node-title { font-size: 28px; font-weight: 600; }
      .node-detail { font-size: 22px; fill: #56614c; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 23px; }
      .edge-label { font-size: 21px; fill: #666c60; }
      .edge-note { font-size: 20px; fill: #76786e; }
      .local-node { fill: #edf1e6; stroke: #acb89b; stroke-width: 1.6; }
      .record-node { fill: #ecefe9; stroke: #abb3a4; stroke-width: 1.6; }
      .chain-node { fill: #f5e8dd; stroke: #c8a994; stroke-width: 1.6; }
      .chain-title { fill: #8d6249; }
      .chain-detail { fill: #906e57; font-size: 22px; }
      .edge { fill: none; stroke: #777b70; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .chain-edge { stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1600" height="990" fill="#fbfaf6"/>
  <text x="64" y="68" class="heading">Local play, on-chain rewards</text>
  <text x="64" y="106" class="subtitle">The Seeker runs the session. Solana records the reward and its payouts.</text>

  <rect x="64" y="148" width="1052" height="320" rx="10" fill="#fdfcf9" stroke="#c8cbbf" stroke-width="1.5" stroke-dasharray="5 7"/>
  <text x="96" y="185" class="boundary-label">Local network</text>
  <text x="1084" y="185" class="boundary-label" text-anchor="end">Wi-Fi or local-only hotspot</text>
  <text x="1264" y="185" class="boundary-label">Solana · internet required</text>

  <g aria-label="Guest phones">
    <rect x="108" y="222" width="300" height="154" rx="3" class="local-node"/>
    <text x="258" y="263" class="node-title" text-anchor="middle">Guest phones</text>
    <text x="258" y="308" class="mono" text-anchor="middle">FormationClient</text>
    <text x="258" y="346" class="node-detail" text-anchor="middle">Wallet optional</text>
  </g>

  <g aria-label="Seeker host">
    <rect x="684" y="222" width="352" height="154" rx="3" class="local-node"/>
    <text x="860" y="263" class="node-title" text-anchor="middle">Seeker host</text>
    <text x="860" y="308" class="mono" text-anchor="middle">FormationHost</text>
    <text x="860" y="346" class="node-detail" text-anchor="middle">Session authority + clock</text>
  </g>

  <path d="M 408 274 H 684" class="edge"/>
  <text x="546" y="256" class="edge-label" text-anchor="middle">Inputs + seals</text>
  <path d="M 684 336 H 408" class="edge"/>
  <text x="546" y="366" class="edge-label" text-anchor="middle">State + clock</text>
  <text x="440" y="419" class="edge-note">Shared session framework</text>
  <text x="440" y="448" class="edge-note">Replaceable challenge modules</text>

  <g aria-label="Reward sponsor">
    <rect x="1264" y="244" width="272" height="98" rx="30" class="chain-node"/>
    <text x="1400" y="284" class="node-title chain-title" text-anchor="middle">Reward sponsor</text>
    <text x="1400" y="317" class="chain-detail" text-anchor="middle">SKR funding</text>
  </g>

  <path d="M 258 376 V 594" class="edge"/>
  <text x="284" y="533" class="edge-label">Saved entitlement</text>
  <path d="M 860 376 V 594" class="edge"/>
  <text x="886" y="533" class="edge-label">Sealed result</text>
  <path d="M 1400 342 V 594" class="edge chain-edge"/>
  <text x="1424" y="533" class="edge-label">Funds SKR</text>

  <g aria-label="Deferred claim">
    <rect x="108" y="594" width="300" height="130" rx="3" class="record-node"/>
    <text x="258" y="634" class="node-title" text-anchor="middle">Deferred claim</text>
    <text x="258" y="672" class="node-detail" text-anchor="middle">Saved proof + claim key</text>
    <text x="258" y="703" class="node-detail" text-anchor="middle">Wallet added later</text>
  </g>

  <g aria-label="Solana ledger">
    <rect x="684" y="594" width="352" height="130" rx="3" class="record-node"/>
    <text x="860" y="634" class="mono" text-anchor="middle">SolanaLedger</text>
    <text x="860" y="672" class="node-detail" text-anchor="middle">Wallet-approved signing</text>
    <text x="860" y="703" class="node-detail" text-anchor="middle">Journal + reconciliation</text>
  </g>

  <g aria-label="Formation vault on Solana">
    <rect x="1264" y="594" width="272" height="130" rx="3" class="chain-node"/>
    <text x="1400" y="634" class="node-title chain-title" text-anchor="middle">Formation vault</text>
    <text x="1400" y="672" class="chain-detail" text-anchor="middle">SKR + roster root</text>
    <text x="1400" y="703" class="chain-detail" text-anchor="middle">Claim bitmap</text>
  </g>

  <path d="M 1036 642 H 1264" class="edge chain-edge"/>
  <text x="1150" y="620" class="edge-label" text-anchor="middle">Unlock + pay</text>
  <text x="1150" y="678" class="edge-note" text-anchor="middle">Solana RPC</text>

  <path d="M 408 668 H 528 Q 540 668 540 680 V 780 Q 540 792 552 792 H 1206 Q 1218 792 1218 780 V 710 Q 1218 698 1230 698 H 1264" class="edge chain-edge"/>
  <text x="884" y="776" class="edge-label" text-anchor="middle">Deferred claim · proof + signature via RPC</text>

  <path d="M 1400 724 V 830" class="edge chain-edge"/>
  <text x="1424" y="789" class="edge-label">Payout</text>
  <g aria-label="Recipient wallets">
    <rect x="1264" y="830" width="272" height="94" rx="30" class="chain-node"/>
    <text x="1400" y="870" class="node-title chain-title" text-anchor="middle" font-size="26">Recipient wallets</text>
    <text x="1400" y="903" class="chain-detail" text-anchor="middle">Owner + helpers</text>
  </g>

  <path d="M 108 902 H 160" class="edge"/>
  <text x="176" y="909" class="edge-note">Local session + device records</text>
  <path d="M 552 902 H 604" class="edge chain-edge"/>
  <text x="620" y="909" class="edge-note">Chain transactions</text>
</svg>
