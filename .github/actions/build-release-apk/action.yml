name: Build release APK
description: Test, build, sign and check the Android release APK, then stage it with its checksums and R8 mapping in dist/.

inputs:
  version-name:
    required: true
  version-code:
    required: true
  cluster:
    required: true
  rpc-url:
    required: true
  expected-cert-sha256:
    description: SHA-256 (lowercase hex) of the certificate the APK must carry
    required: true
  keystore-b64:
    required: true
  keystore-password:
    required: true
  key-alias:
    required: true
  key-password:
    required: true

runs:
  using: composite
  steps:
    # The Gradle daemon pins Azul JDK 21 (app/gradle/gradle-daemon-jvm.properties).
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v4

    - name: Test
      shell: bash
      working-directory: app
      run: ./gradlew testAndroidHostTest :androidApp:lintRelease

    - name: Build the signed APK
      shell: bash
      working-directory: app
      env:
        KEYSTORE_B64: ${{ inputs.keystore-b64 }}
        ORG_GRADLE_PROJECT_formationKeystorePassword: ${{ inputs.keystore-password }}
        ORG_GRADLE_PROJECT_formationKeyAlias: ${{ inputs.key-alias }}
        ORG_GRADLE_PROJECT_formationKeyPassword: ${{ inputs.key-password }}
      run: |
        keystore="$RUNNER_TEMP/formation-release.keystore"
        echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
        ./gradlew :androidApp:assembleRelease \
          -PformationKeystoreFile="$keystore" \
          -Pformation.cluster="${{ inputs.cluster }}" \
          -Pformation.rpcUrl="${{ inputs.rpc-url }}" \
          -PformationVersionName="${{ inputs.version-name }}" \
          -PformationVersionCode="${{ inputs.version-code }}"
        rm -f "$keystore"

    - name: Check the APK before it ships
      shell: bash
      env:
        EXPECTED_CERT_SHA256: ${{ inputs.expected-cert-sha256 }}
        VERSION_NAME: ${{ inputs.version-name }}
        VERSION_CODE: ${{ inputs.version-code }}
      run: |
        apk=app/androidApp/build/outputs/apk/release/androidApp-release.apk
        tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
        "$tools/apksigner" verify --print-certs "$apk" > signers.txt
        cert=$(grep -m1 "certificate SHA-256 digest" signers.txt | awk '{print $NF}')
        if [[ "$cert" != "$EXPECTED_CERT_SHA256" ]]; then
          echo "::error::Signed with $cert, expected $EXPECTED_CERT_SHA256"; exit 1
        fi
        "$tools/aapt2" dump badging "$apk" > badging.txt
        grep -q "versionName='$VERSION_NAME'" badging.txt && grep -q "versionCode='$VERSION_CODE'" badging.txt \
          || { echo "::error::Version mismatch"; exit 1; }
        if grep -q "application-debuggable" badging.txt; then
          echo "::error::The release APK is debuggable"; exit 1
        fi
        grep -q "package: name='xyz.mcxross.formation' " badging.txt \
          || { echo "::error::The release APK has the wrong application ID"; exit 1; }
        mkdir -p dist
        cp "$apk" "dist/formation-$VERSION_NAME.apk"
        # A stable name, so /releases/latest/download/formation.apk always serves the newest.
        cp "$apk" dist/formation.apk
        (cd dist && sha256sum *.apk > SHA256SUMS)
        # R8 renames classes; this file turns a release crash's stack trace back into source lines.
        cp app/androidApp/build/outputs/mapping/release/mapping.txt "dist/mapping-$VERSION_NAME.txt"
        cat dist/SHA256SUMS
