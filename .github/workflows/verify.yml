name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # The Gradle daemon pins Azul JDK 21 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared code, lint the release and assemble Android
        run: >-
          ./gradlew
          testAndroidHostTest
          :androidApp:lintProdRelease
          :androidApp:assembleDebug
      - name: Test the emulator driver
        working-directory: scripts
        run: python3 -m unittest test_overdrive_driver

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and compile shared iOS code
        run: >-
          ./gradlew
          iosSimulatorArm64Test
          :shared:compileKotlinIosSimulatorArm64
      # The Xcode project builds the shared framework through Gradle in its own build phase.
      - name: Build the iOS simulator application
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: program
    env:
      # Matches [toolchain] in program/Anchor.toml.
      SOLANA_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: program
      - name: Install the Solana toolchain
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # The tests load the compiled program, so build it first.
      - name: Build and test the vault program
        run: |
          cargo build-sbf --manifest-path formation-vault/Cargo.toml
          cargo test -p formation-vault

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
