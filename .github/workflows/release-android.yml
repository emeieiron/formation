name: Release Android

# Push a tag like v1.2.3 from main to build, sign and publish the Android APK for direct download.
# Signing secrets live in the android-release environment, which only v* tags can use and which
# waits for approval before each run.
#
# Run it by hand (Actions → Release Android → Run workflow) to rehearse the same build and checks
# with a throwaway signing key. A rehearsal publishes nothing; it uploads the APK as a run artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release
    env:
      # From the android-release environment's variables, so they change without code: the
      # cluster the app settles on, its HTTPS RPC endpoint, and the SHA-256 (lowercase hex) of the
      # certificate every published APK must carry.
      FORMATION_CLUSTER: ${{ vars.FORMATION_CLUSTER }}
      FORMATION_RPC_URL: ${{ vars.FORMATION_RPC_URL }}
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tags must look like v1.2.3, got $tag"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must stay below 100 to keep versionCode increasing"; exit 1
          fi
          # Only release what is already on main.
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag is not on main"; exit 1
          fi
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Check the release configuration
        run: |
          if [[ ! "$FORMATION_CLUSTER" =~ ^(devnet|testnet|mainnet-beta)$ ]]; then
            echo "::error::Set FORMATION_CLUSTER (devnet, testnet or mainnet-beta) in the android-release environment"; exit 1
          fi
          if [[ ! "$FORMATION_RPC_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Set FORMATION_RPC_URL (an https:// URL) in the android-release environment"; exit 1
          fi
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set ANDROID_CERT_SHA256 (64 lowercase hex digits) in the android-release environment"; exit 1
          fi
          echo "Cluster: $FORMATION_CLUSTER"
          echo "RPC: $FORMATION_RPC_URL"

      - uses: ./.github/actions/build-release-apk
        with:
          version-name: ${{ steps.version.outputs.name }}
          version-code: ${{ steps.version.outputs.code }}
          cluster: ${{ env.FORMATION_CLUSTER }}
          rpc-url: ${{ env.FORMATION_RPC_URL }}
          expected-cert-sha256: ${{ env.EXPECTED_CERT_SHA256 }}
          keystore-b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Attest where the APK came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Install

          Download \`formation-android.apk\` below and open it on your phone. Android asks once to allow installs from your browser.

          This build settles rewards on Solana ${FORMATION_CLUSTER}.

          ## Verify

          - SHA-256 checksums are in \`SHA256SUMS\`.
          - Signing certificate SHA-256: \`${EXPECTED_CERT_SHA256}\`
          - Build provenance: \`gh attestation verify formation-android.apk --repo ${GITHUB_REPOSITORY}\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Formation ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

  rehearse:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Make a throwaway signing key
        id: key
        run: |
          keystore="$RUNNER_TEMP/rehearsal.keystore"
          keytool -genkeypair -keystore "$keystore" -storepass rehearsal -keypass rehearsal -alias rehearsal \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Formation rehearsal" -noprompt
          cert=$(keytool -list -v -keystore "$keystore" -storepass rehearsal -alias rehearsal \
            | awk '/SHA256:/ {print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "keystore=$(base64 -w0 "$keystore")" >> "$GITHUB_OUTPUT"
          rm -f "$keystore"

      - uses: ./.github/actions/build-release-apk
        with:
          version-name: 0.0.${{ github.run_number }}
          version-code: ${{ github.run_number }}
          cluster: ${{ vars.FORMATION_CLUSTER || 'devnet' }}
          rpc-url: ${{ vars.FORMATION_RPC_URL || 'https://api.devnet.solana.com' }}
          expected-cert-sha256: ${{ steps.key.outputs.cert }}
          keystore-b64: ${{ steps.key.outputs.keystore }}
          keystore-password: rehearsal
          key-alias: rehearsal
          key-password: rehearsal

      - uses: actions/upload-artifact@v4
        with:
          name: formation-rehearsal-${{ github.run_number }}
          path: dist/
          retention-days: 7
